# Подключение HTTPS через nginx перед приложением:
#   bash scripts/deploy-https.sh
#
# TLS-nginx → app:8000 (внутри app уже nginx + PHP-FPM с несколькими воркерами).

services:
  nginx:
    image: nginx:alpine
    container_name: crm_backend_nginx
    restart: unless-stopped
    networks:
      - crm_backend_net
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
