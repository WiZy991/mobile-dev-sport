# Локальная разработка: MySQL на хост + лёгкий HTTP-прокси к PHP-FPM.
#   COMPOSE_FILE=compose.yaml:compose.dev.yaml docker compose up -d --build
#
# API: http://127.0.0.1:8000

services:
  app:
    # без публикации 9000 наружу — только через nginx-dev

  nginx-dev:
    image: nginx:alpine
    container_name: crm_backend_nginx_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/crm/public:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - crm_backend_net

  database:
    ports:
      - "3306:3306"
