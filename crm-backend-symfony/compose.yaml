services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      APP_TIMEZONE: UTC
    # PHP-FPM слушает 9000 внутри сети; снаружи HTTP/HTTPS только через nginx (compose.https.yaml).
    expose:
      - "9000"
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "php bin/console cache:clear --no-interaction || true;
      php bin/console doctrine:database:create --if-not-exists --no-interaction || true;
      php bin/console doctrine:migrations:migrate --no-interaction || true;
      chown -R www-data:www-data /app/var || true;
      exec php-fpm -F"
    # Секреты с хоста: var/secrets + APNs .p8 (иначе файл есть на хосте, а в контейнере — нет).
    # Акции: public/uploads/promotions на хосте, иначе при пересоздании контейнера uploads пропадут.
    volumes:
      - ./var/secrets:/app/var/secrets:ro
      - ./etc/Apns:/app/etc/Apns:ro
      - ./public/uploads/promotions:/app/public/uploads/promotions
    networks:
      - crm_backend_net

  # Доставка отложенных push/email вне HTTP — иначе API тормозит на 30–40с.
  notifications_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend_notifications
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      APP_TIMEZONE: UTC
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_started
    command: sh -c "while true; do php bin/console app:process-scheduled-notifications --no-interaction || true; sleep 20; done"
    volumes:
      - ./var/secrets:/app/var/secrets:ro
      - ./etc/Apns:/app/etc/Apns:ro
    networks:
      - crm_backend_net

  database:
    image: mysql:8.0
    container_name: crm_backend_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: world_fitness
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    # Порт 3306 не публикуется наружу — только docker-сеть (безопасность / опросник ДКБ).
    # Для локальной отладки: COMPOSE_FILE=compose.yaml:compose.dev.yaml
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp_password"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - crm_backend_net

networks:
  crm_backend_net:
    name: crm_backend_symfony_net
    driver: bridge

volumes:
  database_data:
