services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      APP_TIMEZONE: UTC
    # HTTP :8000 (nginx+FPM внутри контейнера). Снаружи — только через TLS nginx.
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
    # ENTRYPOINT сам делает migrate + supervisord; CMD пустой.
    # Секреты / uploads с хоста.
    volumes:
      - ./var/secrets:/app/var/secrets:ro
      - ./etc/Apns:/app/etc/Apns:ro
      - ./public/uploads/promotions:/app/public/uploads/promotions
      - ./public/uploads/clubs:/app/public/uploads/clubs
    networks:
      - crm_backend_net

  notifications_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend_notifications
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      APP_TIMEZONE: UTC
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_started
    # ENTRYPOINT выполнит migrate, затем этот CMD вместо supervisord.
    command: ["sh", "-c", "while true; do php bin/console app:process-scheduled-notifications --no-interaction || true; sleep 20; done"]
    volumes:
      - ./var/secrets:/app/var/secrets:ro
      - ./etc/Apns:/app/etc/Apns:ro
    networks:
      - crm_backend_net

  database:
    image: mysql:8.0
    container_name: crm_backend_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: world_fitness
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp_password"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - crm_backend_net

networks:
  crm_backend_net:
    name: crm_backend_symfony_net
    driver: bridge

volumes:
  database_data:
