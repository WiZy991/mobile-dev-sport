# TLS-terminator → PHP-FPM app:9000
# resolver + переменная в fastcgi_pass — чтобы DNS Docker обновлялся после рестарта app.

server {
    listen 80;
    listen [::]:80;
    server_name worldcashfit.ru www.worldcashfit.ru dobrozal.ru www.dobrozal.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name worldcashfit.ru www.worldcashfit.ru dobrozal.ru www.dobrozal.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 32m;

    root /var/www/crm/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $crm_fpm app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $crm_fpm;
        fastcgi_read_timeout 70s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
